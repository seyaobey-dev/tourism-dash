[project]
name = "crowd-insights"
version = "0.1.0"
description = "St Patrick's Day crowd and visitor insights for Dublin City Council"
requires-python = ">=3.11"
dependencies = ["dash>=3.0", "plotly>=6.0", "pandas>=2.2"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
